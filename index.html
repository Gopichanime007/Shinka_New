<aside>

<script>
(function(){
'use strict';
const DB_NAME='shinka-work-hub', DB_VERSION=1;
const STORES=['tasks','activities','timeLogs','projects','settings'];
const STATUSES=['Open','In Progress','Blocked','Completed'];
const CODE_STATUSES=['Not Started','In Local','Pushed to Git'];
const INSTANCE_STATUSES=['Not Deployed','TEST','UAT','Production'];
const PRIORITIES=['Low','Medium','High','Critical'];
const TYPES=['CR','Development','Support','Other'];
const WORK_TYPES=['Investigation','Development','Testing','Deployment','Meeting','Support','Documentation','Other'];
let db=null, page='dashboard', currentTaskId=null, taskSearch='', timerInterval=null, toastTimer=null;
let runningTimer=null, timerAction='start';
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(16).slice(2);
const now=()=>new Date().toISOString();
const dateLabel=v=>v?new Date(v).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'}):'—';
const dateOnly=v=>v?new Date(v).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}):'—';
const duration=(n)=>{n=Math.max(0,Math.floor(n||0));const h=Math.floor(n/3600),m=Math.floor(n%3600/60),s=n%60;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')};
const minsLabel=s=>{const m=Math.max(0,Math.round(s/60));return Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m'};
const norm=v=>String(v||'').trim().toLowerCase();
const pill=(v,cls)=>'<span class="pill '+(cls||'p-'+norm(v).replaceAll(' ','-'))+'">'+esc(v)+'</span>';
function applyTheme(theme){const allowed=['system','light','dark'];document.documentElement.dataset.theme=allowed.includes(theme)?theme:'system'}
function showToast(msg,error=false){const t=$('#toast');t.textContent=msg;t.classList.remove('hidden','error');if(error)t.classList.add('error');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hidden'),3800)}
function request(req){return new Promise((resolve,reject)=>{req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('Database request failed'))})}
function txDone(tx){return new Promise((resolve,reject)=>{tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error('Database transaction failed'));tx.onabort=()=>reject(tx.error||new Error('Database transaction aborted'))})}
function openDb(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window)){reject(new Error('This browser does not support IndexedDB.'));return}const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains('tasks')){const s=d.createObjectStore('tasks',{keyPath:'id'});s.createIndex('ticketId','ticketId',{unique:false});s.createIndex('status','status',{unique:false});s.createIndex('projectId','projectId',{unique:false});s.createIndex('updatedAt','updatedAt',{unique:false})}if(!d.objectStoreNames.contains('activities')){const s=d.createObjectStore('activities',{keyPath:'id'});s.createIndex('taskId','taskId',{unique:false});s.createIndex('occurredAt','occurredAt',{unique:false})}if(!d.objectStoreNames.contains('timeLogs')){const s=d.createObjectStore('timeLogs',{keyPath:'id'});s.createIndex('taskId','taskId',{unique:false});s.createIndex('startedAt','startedAt',{unique:false})}if(!d.objectStoreNames.contains('projects')){d.createObjectStore('projects',{keyPath:'id'})}if(!d.objectStoreNames.contains('settings')){d.createObjectStore('settings',{keyPath:'key'})}};req.onsuccess=()=>{req.result.onversionchange=()=>req.result.close();resolve(req.result)};req.onerror=()=>reject(req.error||new Error('Could not open local database'))})}
async function all(store){return request(db.transaction(store,'readonly').objectStore(store).getAll())}
async function get(store,id){return request(db.transaction(store,'readonly').objectStore(store).get(id))}
async function put(store,value){const t=db.transaction(store,'readwrite');t.objectStore(store).put(value);await txDone(t);return value}
async function remove(store,id){const t=db.transaction(store,'readwrite');t.objectStore(store).delete(id);await txDone(t)}
async function logActivity(taskId,type,title,details='',meta={}){await put('activities',{id:uid(),taskId,type,title,details,meta,occurredAt:now()})}
async function getTask(taskId){return get('tasks',taskId)}
async function getProject(projectId){return projectId?get('projects',projectId):null}
async function settings(){const vals=await all('settings');return Object.fromEntries(vals.map(v=>[v.key,v.value]))}
async function seed(){const ps=await all('projects');if(!ps.length){const p={id:uid(),name:'General',description:'Default project for uncategorized tasks',createdAt:now(),updatedAt:now(),archived:false};await put('projects',p);await put('settings',{key:'defaultProjectId',value:p.id})}}
async function loadAll(){const [tasks,activities,timeLogs,projects,settingsList]=await Promise.all([all('tasks'),all('activities'),all('timeLogs'),all('projects'),all('settings')]);return {tasks,activities,timeLogs,projects,settings:Object.fromEntries(settingsList.map(v=>[v.key,v.value]))}}
async function saveTask(data,existingId=null){const timestamp=now();let previous=null;if(existingId)previous=await getTask(existingId);const task={id:existingId||uid(),ticketId:data.ticketId.trim(),title:data.title.trim(),description:data.description.trim(),type:data.type,projectId:data.projectId||null,priority:data.priority,assignedBy:data.assignedBy.trim(),status:data.status,codeStatus:data.codeStatus,instanceStatus:data.instanceStatus,workProgress:(data.workProgress||'').trim(),notes:data.notes.trim(),createdAt:previous?.createdAt||timestamp,updatedAt:timestamp,completedAt:previous?.completedAt||null,deletedAt:previous?.deletedAt||null};if(!task.title)throw new Error('Task title is required.');if(!task.ticketId)throw new Error('Ticket ID is required.');if(previous){const fields=['ticketId','title','description','type','projectId','priority','assignedBy','status','codeStatus','instanceStatus','workProgress','notes'];const changes=[];for(const f of fields)if((previous[f]??'')!==(task[f]??''))changes.push({field:f,from:previous[f]??'',to:task[f]??''});if(previous.status!=='Completed'&&task.status==='Completed'){task.completedAt=timestamp;changes.push({field:'completedAt',from:'',to:timestamp})}if(previous.status==='Completed'&&task.status!=='Completed'){task.completedAt=null;changes.push({field:'completedAt',from:previous.completedAt||'',to:''})}await put('tasks',task);if(changes.length){for(const change of changes){const label=({ticketId:'Ticket ID',title:'Title',description:'Description',type:'Task Type',projectId:'Project',priority:'Priority',assignedBy:'Assigned By',status:'Task Status',codeStatus:'Code Status',instanceStatus:'Instance Status',workProgress:'Work Progress',notes:'Notes',completedAt:'Completion Date'})[change.field]||change.field;let from=change.from,to=change.to;if(change.field==='projectId'){from=(await getProject(from))?.name||'None';to=(await getProject(to))?.name||'None'}await logActivity(task.id,'change',label+' changed',String(from||'—')+' → '+String(to||'—'),{field:change.field,from:change.from,to:change.to})}}}else{await put('tasks',task);await logActivity(task.id,'created','Task created',task.ticketId+' · '+task.title,{taskSnapshot:{ticketId:task.ticketId,title:task.title,status:task.status,priority:task.priority}})}return task}
function statusSelect(name,values,current){return '<select name="'+name+'">'+values.map(v=>'<option '+(v===current?'selected':'')+' value="'+esc(v)+'">'+esc(v)+'</option>').join('')+'</select>'}
function projectSelect(projects,current,includeAll=false){return '<select name="projectId">'+(includeAll?'<option value="">All projects</option>':'<option value="">No project</option>')+projects.filter(p=>!p.archived).sort((a,b)=>a.name.localeCompare(b.name)).map(p=>'<option value="'+p.id+'" '+(p.id===current?'selected':'')+'>'+esc(p.name)+'</option>').join('')+'</select>'}
function field(label,name,value,type='text',extra=''){return '<div class="field"><label for="f-'+name+'">'+label+'</label><input id="f-'+name+'" name="'+name+'" type="'+type+'" value="'+esc(value||'')+'" '+extra+'></div>'}
function selectField(label,name,values,current){return '<div class="field"><label for="f-'+name+'">'+label+'</label>'+statusSelect(name,values,current)+'</div>'}
function taskCard(t,projects,logs=[]){const p=projects.find(x=>x.id===t.projectId);const secs=logs.filter(l=>l.taskId===t.id&&!l.deletedAt).reduce((a,l)=>a+(l.durationSeconds||0),0);const removed=!!t.deletedAt;return '<article class="task-row" data-open-task="'+t.id+'" tabindex="0" role="group" aria-label="Task '+esc(t.ticketId)+'">'+
'<div class="task-row-top"><div style="min-width:0"><div class="task-id">'+esc(t.ticketId)+' · '+esc(t.type)+'</div><div class="task-title">'+esc(t.title)+'</div><div class="muted tiny" style="margin-top:4px">'+esc(p?.name||'No project')+' · Updated '+esc(dateLabel(t.updatedAt))+'</div></div><div>'+ (removed?pill('Deleted','p-deleted'):pill(t.status))+'</div></div>'+
'<div class="task-meta">'+pill(t.priority,'p-'+norm(t.priority))+' '+pill(t.codeStatus)+' '+pill(t.instanceStatus)+'</div>'+
'<div class="row-foot"><span>◷ '+minsLabel(secs)+' logged'+(t.assignedBy?' · Assigned by '+esc(t.assignedBy):'')+'</span><span>Open details ↗</span></div>'+
'<div class="actions" style="margin-top:0"><button class="small" data-action="open-task" data-id="'+t.id+'">View details</button>'+(removed?'<button class="small" data-action="restore-task" data-id="'+t.id+'">↺ Restore</button>':'<button class="small danger" data-action="delete-task" data-id="'+t.id+'">⌫ Delete</button>')+'</div></article>'}
function metric(label,value,icon,sub){return '<div class="metric"><div class="metric-head"><span>'+label+'</span><span class="metric-icon">'+icon+'</span></div><strong>'+value+'</strong><small>'+sub+'</small></div>'}
function empty(title,desc,button=''){return '<div class="empty"><b>'+title+'</b>'+desc+(button?'<div style="margin-top:13px">'+button+'</div>':'')+'</div>'}

else if(page==='projects'){html='<section class="panel"><div class="panel-head"><div><h2>Your projects</h2><div class="panel-sub">Group work by project and see active progress.</div></div><button class="primary" data-action="new-project">＋ New project</button></div>'+(projects.length?'<div class="task-list">'+projects.sort((a,b)=>a.name.localeCompare(b.name)).map(p=>{const pts=visible.filter(t=>t.projectId===p.id),open=pts.filter(t=>t.status!=='Completed').length;return '<div class="task-row" style="cursor:default"><div class="task-row-top"><div><div class="task-title">'+esc(p.name)+'</div><div class="muted tiny">'+esc(p.description||'No description')+'</div></div><span class="pill">'+(p.archived?'Archived':'Active')+'</span></div><div class="task-meta"><span class="pill">'+pts.length+' tasks</span><span class="pill p-in-progress">'+open+' active</span><span class="pill p-completed">'+(pts.length-open)+' completed</span></div><div class="actions" style="margin-top:0"><button class="small" data-action="filter-project" data-id="'+p.id+'">View tasks</button><button class="small" data-action="edit-project" data-id="'+p.id+'">Edit</button>'+(p.name!=='General'?'<button class="small" data-action="archive-project" data-id="'+p.id+'">'+(p.archived?'Restore':'Archive')+'</button>':'')+'</div></div>'}).join('')+'</div>':empty('No projects','Add a project to organize related tickets.'))+'</section>'}
else if(page==='projectForm'){const proj=await getProject(currentTaskId);html='<section class="panel"><div class="panel-head"><div><h2>'+(proj?'Edit project':'New project')+'</h2><div class="panel-sub">Projects help group tasks and dashboard summaries.</div></div></div><form id="projectForm"><div class="form-grid">'+field('Project name *','name',proj?.name||'','text','required maxlength="120"')+'<div class="field span2"><label>Description</label><textarea name="description" maxlength="2000">'+esc(proj?.description||'')+'</textarea></div></div><div class="actions"><button type="button" data-action="cancel-form">Cancel</button><button class="primary" type="submit">Save project</button></div></form></section>'}
else if(page==='settings'){html='<section class="panel"><div class="panel-head"><div><h2>Data & backup</h2><div class="panel-sub">Keep a copy of your work independent of browser storage.</div></div></div><div class="notice">Your tasks, activities, projects, and time logs are saved in this browser’s IndexedDB. They are not synced to GitHub or another device. Clearing website data can remove them.</div><div class="settings-grid"><div class="setting-card"><h3>Appearance</h3><p>Choose how Shinka looks on this browser. System follows your device theme.</p><div class="field"><label for="themePreference">Theme</label><select id="themePreference"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></div><div class="muted tiny" style="margin-top:8px">Saved locally for this browser.</div></div><div class="setting-card"><h3>Export full backup</h3><p>Download a versioned JSON file containing tasks, status history, time logs, projects, and settings.</p><button class="primary" data-action="export">⇩ Export JSON backup</button></div><div class="setting-card"><h3>Restore from backup</h3><p>Validate a Shinka JSON backup before importing it. You can merge records or replace this workspace after confirmation.</p><button data-action="import">⇧ Choose JSON backup</button></div><div class="setting-card"><h3>Backup cadence</h3><p>Set your preferred reminder interval. Browser reminders can only be shown when this app is open.</p><div class="field"><label>Reminder interval</label><select id="backupCadence"><option value="weekly">Weekly</option><option value="monthly">Monthly</option><option value="off">Off</option></select></div><div class="muted tiny" id="backupMeta" style="margin-top:8px"></div><button style="margin-top:10px" data-action="save-settings">Save preference</button></div><div class="setting-card"><h3>Local data summary</h3><p>These counts reflect data currently stored in this browser.</p><div class="stat-line"><span>Tasks</span><strong>'+visible.length+'</strong></div><div class="stat-line"><span>Activity entries</span><strong>'+activities.length+'</strong></div><div class="stat-line"><span>Time logs</span><strong>'+timeLogs.filter(l=>!l.deletedAt).length+'</strong></div><div class="stat-line"><span>Projects</span><strong>'+projects.length+'</strong></div></div></div><div class="section-title">Workspace integrity</div><div class="notice">Import is validated before writing. Replace mode needs explicit confirmation. Task IDs and child relationships are preserved. Deleted tasks are soft-deleted by default and remain in the backup.</div><div class="actions"><button class="danger" data-action="clear-workspace">Clear all local data…</button></div></section>'}
$('#appContent').innerHTML=html;
if(page==='tasks'||page==='history'){const [s,p,pr]=['statusFilter','priorityFilter','projectFilter'];function filterTasks(){const q=norm($('#taskSearch')?.value||'');const st=$('#'+s)?.value||'',priority=$('#'+p)?.value||'',project=$('#'+pr)?.value||'';const recordMode=$('#recordFilter')?.value||'active';let list=tasks.filter(t=>page==='history'?(recordMode==='deleted'?!!t.deletedAt:recordMode==='all'?true:!t.deletedAt):!t.deletedAt&&t.status!=='Completed');list=list.filter(t=>(!q||[t.ticketId,t.title,t.description,t.workProgress,t.assignedBy,t.notes,t.type].some(v=>norm(v).includes(q)))&&(!st||t.status===st)&&(!priority||t.priority===priority)&&(!project||t.projectId===project)).sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt));$('#filteredTasks').innerHTML=list.length?list.map(t=>taskCard(t,projects,timeLogs)).join(''):empty(recordMode==='deleted'?'No deleted tasks':'No matching tasks',recordMode==='deleted'?'Deleted tasks will appear here so they can be restored.':'Try a different search or filter, or create a task.');$('#taskCount').textContent=list.length+' task(s) shown';}
$('#taskSearch').addEventListener('input',filterTasks);[s,p,pr].forEach(id=>$('#'+id).addEventListener('change',filterTasks));filterTasks();}
if(page==='settings'){const st=d.settings;$('#themePreference').value=st.theme||'system';applyTheme(st.theme||'system');$('#backupCadence').value=st.backupCadence||'monthly';$('#backupMeta').textContent=st.lastBackupAt?'Last export: '+dateLabel(st.lastBackupAt):'No backup recorded in this browser yet.'}
if(page==='tracker'){if(runningTimer){$('#timerDisplay').textContent=duration(timerElapsed());const t=tasks.find(t=>t.id===runningTimer.taskId);$('#timerTaskLabel').textContent=(runningTimer.pausedAt?'Paused · ':'Running · ')+(t?t.ticketId+' · '+t.title:'Task not found');}if(timerInterval)clearInterval(timerInterval);timerInterval=setInterval(()=>{const el=$('#timerDisplay');if(el&&runningTimer)el.textContent=duration(timerElapsed())},1000)}
else if(timerInterval){clearInterval(timerInterval);timerInterval=null}
}
function timerElapsed(){if(!runningTimer)return 0;return (runningTimer.elapsedBeforePause||0)+(runningTimer.pausedAt?0:Math.max(0,(Date.now()-new Date(runningTimer.segmentStartedAt).getTime())/1000))}
async function persistTimer(){await put('settings',{key:'activeTimer',value:runningTimer})}
async function readTimer(){const v=await get('settings','activeTimer');runningTimer=v?.value||null}
async function startTimer(taskId){if(!taskId)throw new Error('Choose a task before starting the timer.');if(runningTimer)throw new Error('A timer is already active. Stop it before starting another.');const task=await getTask(taskId);if(!task||task.deletedAt)throw new Error('The selected task is not available.');if(task.status==='Completed')throw new Error('Reopen the task before tracking additional time.');runningTimer={id:uid(),taskId,workType:'Development',note:'Timer session',startedAt:now(),segmentStartedAt:now(),elapsedBeforePause:0,pausedAt:null,recoveredGapSeconds:0};await persistTimer();await logActivity(taskId,'timer','Timer started','Started at '+dateLabel(runningTimer.startedAt));await render();showToast('Timer started for '+task.ticketId)}
async function pauseTimer(){if(!runningTimer||runningTimer.pausedAt)return;runningTimer.elapsedBeforePause=timerElapsed();runningTimer.pausedAt=now();runningTimer.segmentStartedAt=null;await persistTimer();await logActivity(runningTimer.taskId,'timer','Timer paused','Elapsed '+minsLabel(runningTimer.elapsedBeforePause));await render();showToast('Timer paused')}
async function resumeTimer(){if(!runningTimer||!runningTimer.pausedAt)return;runningTimer.segmentStartedAt=now();runningTimer.pausedAt=null;await persistTimer();await logActivity(runningTimer.taskId,'timer','Timer resumed','Resumed at '+dateLabel(now()));await render();showToast('Timer resumed')}
async function stopTimer(){if(!runningTimer)throw new Error('No active timer to stop.');const r=runningTimer;const secs=Math.round(timerElapsed());if(secs<1)throw new Error('Timer duration must be at least one second.');const gap=r.recoveredGapSeconds||0;if(gap>8*60*60&&!confirm('This timer includes a long elapsed gap of '+minsLabel(gap)+'. If the laptop slept or the browser was closed, this may overcount work. Save the full elapsed duration anyway?'))return;const log={id:uid(),taskId:r.taskId,workType:r.workType||'Development',note:r.note||'Timer session',method:'timer',startedAt:r.startedAt,endedAt:now(),durationSeconds:secs,createdAt:now(),deletedAt:null};const t=db.transaction(['timeLogs','activities','settings'],'readwrite');t.objectStore('timeLogs').put(log);t.objectStore('activities').put({id:uid(),taskId:r.taskId,type:'time',title:'Time logged',details:minsLabel(secs)+' · '+(r.workType||'Development')+' · Timer session',meta:{timeLogId:log.id,durationSeconds:secs},occurredAt:now()});t.objectStore('settings').put({key:'activeTimer',value:null});await txDone(t);runningTimer=null;await render();showToast('Saved '+minsLabel(secs))}
function downloadText(filename,text,type='application/json'){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function csvCell(value){const s=String(value??'');return '"'+s.replace(/"/g,'""')+'"'}
async function downloadTaskReport(){const d=await loadAll();const q=norm($('#taskSearch')?.value||'');const st=$('#statusFilter')?.value||'';const priority=$('#priorityFilter')?.value||'';const project=$('#projectFilter')?.value||'';const recordMode=$('#recordFilter')?.value||'active';let list=d.tasks.filter(t=>recordMode==='deleted'?!!t.deletedAt:recordMode==='all'?true:!t.deletedAt);list=list.filter(t=>(!q||[t.ticketId,t.title,t.description,t.workProgress,t.assignedBy,t.notes,t.type].some(v=>norm(v).includes(q)))&&(!st||t.status===st)&&(!priority||t.priority===priority)&&(!project||t.projectId===project)).sort((a,b)=>String(a.createdAt||'').localeCompare(String(b.createdAt||'')));const rows=[['Date','Ticket ID','Description','Status','Code Status','Work Progress'],...list.map(t=>[t.createdAt?new Date(t.createdAt).toLocaleDateString('en-CA'):'',t.ticketId,t.description,t.status,t.codeStatus,t.workProgress||''])];const csv='\uFEFF'+rows.map(row=>row.map(csvCell).join(',')).join('\r\n');const date=new Date().toISOString().slice(0,10);downloadText('shinka-task-report-'+date+'.csv',csv,'text/csv;charset=utf-8');showToast('Downloaded task report with '+list.length+' task(s).')}
async function exportBackup(){const data=await loadAll();const backupSettings={...data.settings};delete backupSettings.activeTimer;const backup={format:'shinka-work-hub-backup',schemaVersion:1,exportedAt:now(),appVersion:'0.1.0',tasks:data.tasks,activities:data.activities,timeLogs:data.timeLogs,projects:data.projects,settings:backupSettings};const stamp=new Date().toISOString().slice(0,10);downloadText('shinka-work-hub-backup-'+stamp+'.json',JSON.stringify(backup,null,2));await put('settings',{key:'lastBackupAt',value:now()});await put('settings',{key:'lastBackupCounts',value:{tasks:data.tasks.length,activities:data.activities.length,timeLogs:data.timeLogs.length,projects:data.projects.length}});showToast('JSON backup prepared. Save it in an approved folder.');if(page==='settings')render()}
function validateBackup(obj){if(!obj||obj.format!=='shinka-work-hub-backup'||obj.schemaVersion!==1)throw new Error('Unsupported backup format or schema version.');for(const key of STORES.slice(0,4))if(!Array.isArray(obj[key]))throw new Error('Backup is missing the '+key+' collection.');if(!obj.settings||typeof obj.settings!=='object'||Array.isArray(obj.settings))throw new Error('Backup settings are invalid.');const taskIds=new Set();for(const t of obj.tasks){if(!t||typeof t.id!=='string'||!t.id||typeof t.ticketId!=='string'||typeof t.title!=='string')throw new Error('A task record is invalid.');if(taskIds.has(t.id))throw new Error('Duplicate task ID in backup.');taskIds.add(t.id);if(!STATUSES.includes(t.status)||!CODE_STATUSES.includes(t.codeStatus)||!INSTANCE_STATUSES.includes(t.instanceStatus)||!PRIORITIES.includes(t.priority)||!TYPES.includes(t.type))throw new Error('A task has an unrecognized status, priority, or type.');}const projIds=new Set(obj.projects.map(p=>p.id));for(const t of obj.tasks)if(t.projectId&&!projIds.has(t.projectId))throw new Error('Task '+t.ticketId+' references a missing project.');for(const a of obj.activities)if(!a||typeof a.id!=='string'||!taskIds.has(a.taskId)||typeof a.occurredAt!=='string')throw new Error('An activity references a missing task or has invalid fields.');for(const l of obj.timeLogs)if(!l||typeof l.id!=='string'||!taskIds.has(l.taskId)||!Number.isFinite(l.durationSeconds)||l.durationSeconds<0||typeof l.startedAt!=='string')throw new Error('A time log is invalid or references a missing task.');if(obj.projects.some(p=>!p||typeof p.id!=='string'||typeof p.name!=='string'||!p.name.trim()))throw new Error('A project record is invalid.');return true}
async function importBackupFile(file){if(!file) return; if(file.size>25*1024*1024)throw new Error('Backup exceeds 25 MB. Please use a smaller backup.');const obj=JSON.parse(await file.text());validateBackup(obj);const mode=confirm('Validated backup contains '+obj.tasks.length+' task(s), '+obj.activities.length+' activity entries, '+obj.timeLogs.length+' time logs, and '+obj.projects.length+' project(s).\n\nOK = MERGE records (existing IDs will be replaced by backup records).\nCancel = choose whether to replace the workspace instead.');let replace=false;if(!mode)replace=confirm('Replace all current Shinka data with this backup? This cannot be undone. Choose Cancel to abort the import.');if(!mode&&!replace)return;const t=db.transaction(STORES,'readwrite');try{if(replace){for(const name of STORES)t.objectStore(name).clear()}for(const name of ['tasks','activities','timeLogs','projects']){const store=t.objectStore(name);for(const rec of obj[name])store.put(rec)}const ss=t.objectStore('settings');if(replace){for(const [key,value] of Object.entries(obj.settings))if(key!=='activeTimer')ss.put({key,value});ss.put({key:'activeTimer',value:null})}else{for(const [key,value] of Object.entries(obj.settings))if(key!=='activeTimer')ss.put({key,value})}await txDone(t);showToast('Backup imported successfully.');await render()}catch(e){try{t.abort()}catch{}throw e}}
async function markComplete(reopen=false){const t=await getTask(currentTaskId);if(!t)throw new Error('Task not found.');if(reopen){if(t.status!=='Completed')return;const target=prompt('Reopen as which status? Enter Open, In Progress, or Blocked.','In Progress');if(target===null)return;if(!['Open','In Progress','Blocked'].includes(target))throw new Error('Choose Open, In Progress, or Blocked.');const prior=t.status;t.status=target;t.completedAt=null;t.updatedAt=now();await put('tasks',t);await logActivity(t.id,'reopened','Task reopened',prior+' → '+target);showToast('Task reopened as '+target)}else{if(t.status==='Completed')return;if(!confirm('Mark '+t.ticketId+' as Completed? You can reopen it later.'))return;t.status='Completed';t.completedAt=now();t.updatedAt=now();await put('tasks',t);await logActivity(t.id,'completed','Task marked Completed','Completed manually at '+dateLabel(t.completedAt));showToast('Task marked Completed')}await render()}
async function softDeleteTask(){const t=await getTask(currentTaskId);if(!t)return;if(!confirm('Move '+t.ticketId+' to Deleted tasks? Its activity and time logs will be retained in the backup.'))return;t.deletedAt=now();t.updatedAt=now();await put('tasks',t);await logActivity(t.id,'deleted','Task moved to Deleted','Soft-deleted at '+dateLabel(t.deletedAt));page='history';await render();showToast('Task moved to deleted records.')}
function formData(form){return Object.fromEntries(new FormData(form).entries())}
async function saveTime(form){const d=formData(form);const task=await getTask(d.taskId);if(!task||task.deletedAt)throw new Error('Select an existing task.');if(task.status==='Completed')throw new Error('Reopen the task before adding time.');const hours=Number(d.hours||0),minutes=Number(d.minutes||0);if(!Number.isInteger(hours)||hours<0||hours>1000||!Number.isInteger(minutes)||minutes<0||minutes>59)throw new Error('Enter valid hours and minutes.');const secs=(hours*60+minutes)*60;if(secs<=0)throw new Error('Duration must be greater than zero.');if(!d.workDate)throw new Error('Work date is required.');const started=new Date(d.workDate+'T12:00:00').toISOString();const log={id:uid(),taskId:d.taskId,workType:d.workType,note:d.note.trim(),method:'manual',startedAt:started,endedAt:null,durationSeconds:secs,createdAt:now(),deletedAt:null};await put('timeLogs',log);await logActivity(task.id,'time','Time logged',minsLabel(secs)+' · '+d.workType+' · Manual entry',{timeLogId:log.id,durationSeconds:secs});await render();showToast('Time log saved')}
async function showTaskForm(edit=false){if(edit){const t=await getTask(currentTaskId);if(!t)throw new Error('Task not found.');page='editTask'}else{currentTaskId=null;page='newTask'}await render()}
async function clearWorkspace(){if(!confirm('Delete ALL locally stored Shinka data, including tasks, activity, projects, and time logs? Export a backup first.'))return;if(!confirm('Final confirmation: this action permanently clears the local browser database. Continue?'))return;db.close();await new Promise((resolve,reject)=>{const r=indexedDB.deleteDatabase(DB_NAME);r.onsuccess=resolve;r.onerror=()=>reject(r.error);r.onblocked=()=>reject(new Error('Database is still in use by another tab. Close other Shinka tabs and retry.'))});db=await openDb();await seed();const savedSettings=await settings();applyTheme(savedSettings.theme||'system');await readTimer();page='dashboard';await render();showToast('Local workspace cleared.')}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(b){try{const a=b.dataset.action;switch(a){case'open-task':currentTaskId=b.dataset.id;page='detail';await render();break;case'restore-task':{const t=await getTask(b.dataset.id);if(t&&t.deletedAt){t.deletedAt=null;t.updatedAt=now();await put('tasks',t);await logActivity(t.id,'restored','Task restored','Restored from deleted tasks');await render();showToast('Task restored.')}break}case'new-task':await showTaskForm(false);break;case'edit-task':await showTaskForm(true);break;case'cancel-form':page=currentTaskId?'detail':'dashboard';if(page==='editTask'||page==='newTask')page='dashboard';await render();break;case'complete-task':await markComplete(false);break;case'reopen-task':await markComplete(true);break;case'delete-task':currentTaskId=b.dataset.id||currentTaskId;await softDeleteTask();break;case'log-time':page='tracker';await render();break;case'start-timer':await startTimer($('#timerTask')?.value);break;case'pause-timer':await pauseTimer();break;case'resume-timer':await resumeTimer();break;case'stop-timer':if(confirm('Stop the timer and save the recorded duration?'))await stopTimer();break;case'export':await exportBackup();break;case'download-report':await downloadTaskReport();break;case'import':$('#importFile').click();break;case'save-settings':await put('settings',{key:'backupCadence',value:$('#backupCadence').value});await render();showToast('Backup preference saved.');break;case'clear-workspace':await clearWorkspace();break;case'new-project':currentTaskId=null;page='projectForm';await render();break;case'edit-project':currentTaskId=b.dataset.id;page='projectForm';await render();break;case'filter-project':page='tasks';await render();if($('#projectFilter')){$('#projectFilter').value=b.dataset.id;$('#projectFilter').dispatchEvent(new Event('change'))}break;case'archive-project':{const p=await getProject(b.dataset.id);if(!p)break;p.archived=!p.archived;p.updatedAt=now();await put('projects',p);await logActivityForProject(p.id,p.archived?'Project archived':'Project restored');await render();showToast(p.archived?'Project archived':'Project restored');break}case'delete-time':if(confirm('Delete this time log? The action will remain traceable in the task activity history.')){const l=await get('timeLogs',b.dataset.id);if(l){l.deletedAt=now();await put('timeLogs',l);await logActivity(l.taskId,'time-deleted','Time log deleted',minsLabel(l.durationSeconds));await render();showToast('Time log deleted')}}break;default:break}}catch(err){showToast(err.message||'Action failed.',true)}return;}const pageBtn=e.target.closest('[data-page]');if(pageBtn){page=pageBtn.dataset.page;await render();return}const open=e.target.closest('[data-open-task]');if(open){currentTaskId=open.dataset.openTask;page='detail';await render();return}});
async function logActivityForProject(projectId,title){const task=(await all('tasks')).find(t=>t.projectId===projectId);if(task)await logActivity(task.id,'project',title,'Project: '+(await getProject(projectId)).name)}
document.addEventListener('submit',async e=>{e.preventDefault();try{if(e.target.id==='taskForm'){const d=formData(e.target);const wasEdit=page==='editTask';const t=await saveTask(d,wasEdit?currentTaskId:null);currentTaskId=t.id;page='detail';await render();showToast(wasEdit?'Task updated.':'Task created.')}else if(e.target.id==='timeForm'){await saveTime(e.target)}else if(e.target.id==='projectForm'){const d=formData(e.target);if(!d.name.trim())throw new Error('Project name is required.');const existing=currentTaskId?await getProject(currentTaskId):null;const p={id:existing?.id||uid(),name:d.name.trim(),description:d.description.trim(),createdAt:existing?.createdAt||now(),updatedAt:now(),archived:existing?.archived||false};await put('projects',p);currentTaskId=null;page='projects';await render();showToast(existing?'Project updated.':'Project created.')}}catch(err){showToast(err.message||'Could not save.',true)}});
document.addEventListener('change',async e=>{if(e.target&&e.target.id==='themePreference'){const theme=e.target.value;applyTheme(theme);await put('settings',{key:'theme',value:theme});showToast('Theme preference saved.')}});
$('#importFile').addEventListener('change',async e=>{try{if(e.target.files?.[0])await importBackupFile(e.target.files[0])}catch(err){showToast('Import failed: '+(err.message||'Invalid backup.'),true)}finally{e.target.value=''}});
window.addEventListener('beforeunload',()=>{if(timerInterval)clearInterval(timerInterval)});
(async()=>{try{db=await openDb();await seed();await readTimer();if(runningTimer&&!runningTimer.pausedAt){const gap=Math.max(0,(Date.now()-new Date(runningTimer.segmentStartedAt).getTime())/1000);if(gap>8*60*60){runningTimer.recoveredGapSeconds=gap;await persistTimer();showToast('Recovered timer gap exceeds 8 hours. Review the duration before saving.');}}await render()}catch(e){$('#appContent').innerHTML='<section class="panel"><h2>Local storage unavailable</h2><p class="muted">'+esc(e.message||'The browser could not open IndexedDB.')+'</p><p class="muted">Try a supported browser or check company browser policies.</p></section>'}})();
})();
</script>
