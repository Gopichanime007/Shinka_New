<script>
(function(){
'use strict';
const DB_NAME='shinka-work-hub', DB_VERSION=2;
const STORES=['tasks','activities','timeLogs','projects','assignees','timesheets','settings'];
const STATUSES=['Open','In Progress','Testing','Completed','Blocked'];

let db=null, page='dashboard', currentTaskId=null, taskSearch='', timerInterval=null, toastTimer=null, settingsTab='profile'; let timesheetDraftId=null; const timesheetAutosaveTimers=new Map();
let runningTimer=null, timerAction='start';
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(16).slice(2);

const dateLabel=v=>v?new Date(v).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'}):'—';
const dateOnly=v=>v?new Date(v).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}):'—';
const duration=(n)=>{n=Math.max(0,Math.floor(n||0));const h=Math.floor(n/3600),m=Math.floor(n%3600/60),s=n%60;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')};
const minsLabel=s=>{const m=Math.max(0,Math.round(s/60));return Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m'};

function applyTheme(theme){const allowed=['system','light','dark'];document.documentElement.dataset.theme=allowed.includes(theme)?theme:'system'}
function showToast(msg,error=false){const t=$('#toast');t.textContent=msg;t.classList.remove('hidden','error');if(error)t.classList.add('error');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hidden'),3800)}
function request(req){return new Promise((resolve,reject)=>{req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('Database request failed'))})}
function txDone(tx){return new Promise((resolve,reject)=>{tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error('Database transaction failed'));tx.onabort=()=>reject(tx.error||new Error('Database transaction aborted'))})}
function openDb(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window)){reject(new Error('This browser does not support IndexedDB.'));return}const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains('tasks')){const s=d.createObjectStore('tasks',{keyPath:'id'});s.createIndex('ticketId','ticketId',{unique:false});s.createIndex('status','status',{unique:false});s.createIndex('projectId','projectId',{unique:false});s.createIndex('updatedAt','updatedAt',{unique:false})}if(!d.objectStoreNames.contains('activities')){const s=d.createObjectStore('activities',{keyPath:'id'});s.createIndex('taskId','taskId',{unique:false});s.createIndex('occurredAt','occurredAt',{unique:false})}if(!d.objectStoreNames.contains('timeLogs')){const s=d.createObjectStore('timeLogs',{keyPath:'id'});s.createIndex('taskId','taskId',{unique:false});s.createIndex('startedAt','startedAt',{unique:false})}if(!d.objectStoreNames.contains('projects')){d.createObjectStore('projects',{keyPath:'id'})}if(!d.objectStoreNames.contains('assignees')){const s=d.createObjectStore('assignees',{keyPath:'id'});s.createIndex('name','name',{unique:false});s.createIndex('active','active',{unique:false})}if(!d.objectStoreNames.contains('timesheets')){const s=d.createObjectStore('timesheets',{keyPath:'id'});s.createIndex('date','date',{unique:false});s.createIndex('ticketId','ticketId',{unique:false});s.createIndex('projectId','projectId',{unique:false})}if(!d.objectStoreNames.contains('settings')){d.createObjectStore('settings',{keyPath:'key'})}};req.onsuccess=()=>{req.result.onversionchange=()=>req.result.close();resolve(req.result)};req.onerror=()=>reject(req.error||new Error('Could not open local database'))})}
async function all(store){return request(db.transaction(store,'readonly').objectStore(store).getAll())}
async function get(store,id){return request(db.transaction(store,'readonly').objectStore(store).get(id))}
async function put(store,value){const t=db.transaction(store,'readwrite');t.objectStore(store).put(value);await txDone(t);return value}
async function remove(store,id){const t=db.transaction(store,'readwrite');t.objectStore(store).delete(id);await txDone(t)}
async function logActivity(taskId,type,title,details='',meta={}){await put('activities',{id:uid(),taskId,type,title,details,meta,occurredAt:now()})}
async function getTask(taskId){return get('tasks',taskId)}
async function getProject(projectId){return projectId?get('projects',projectId):null}
async function settings(){const vals=await all('settings');return Object.fromEntries(vals.map(v=>[v.key,v.value]))}
function seriesConfig(st){const v=st?.taskNoSeries||{};return {prefix:String(v.prefix??'SHK-').trim().slice(0,24),padding:Math.min(8,Math.max(3,Number(v.padding)||3))}}
function formatTaskNo(n,series){return series.prefix+String(n).padStart(series.padding,'0')}
async function ensureTaskNumbers(){const st=await settings();const series=seriesConfig(st);if(!st.taskNoSeries)await put('settings',{key:'taskNoSeries',value:series});const tasks=await all('tasks');const missing=tasks.filter(t=>!t.taskNo);if(!missing.length)return;let n=Math.max(0,...tasks.map(t=>{const m=String(t.taskNo||'').match(/(\\d+)$/);return m?Number(m[1]):0}));for(const t of missing.sort((a,b)=>String(a.createdAt||'').localeCompare(String(b.createdAt||'')))){t.taskNo=formatTaskNo(++n,series);await put('tasks',t)}}
async function nextTaskNo(existingId=null){await ensureTaskNumbers();const st=await settings(),series=seriesConfig(st),tasks=await all('tasks');if(existingId){const current=tasks.find(t=>t.id===existingId);if(current?.taskNo)return current.taskNo}const matches=tasks.map(t=>{const raw=String(t.taskNo||'');const m=raw.match(/(\\d+)$/);return m?{task:t,n:Number(m[1])}:null}).filter(Boolean).sort((a,b)=>a.n-b.n);const max=matches.length?matches[matches.length-1].n:0;const highest=matches.filter(x=>x.n===max);if(max>0&&highest.length&&highest.every(x=>x.task.deletedAt))return formatTaskNo(max,series);return formatTaskNo(max+1,series)}
async function seed(){const ps=await all('projects');if(!ps.length){const p={id:uid(),name:'General',description:'Default project for uncategorized tasks',createdAt:now(),updatedAt:now(),archived:false};await put('projects',p);await put('settings',{key:'defaultProjectId',value:p.id})}}
async function loadAll(){const [tasks,activities,timeLogs,projects,assignees,timesheets,settingsList]=await Promise.all([all('tasks'),all('activities'),all('timeLogs'),all('projects'),all('assignees'),all('timesheets'),all('settings')]);return {tasks,activities,timeLogs,projects,assignees,timesheets,settings:Object.fromEntries(settingsList.map(v=>[v.key,v.value]))}}
async function saveTask(data,existingId=null){const timestamp=now();let previous=null;if(existingId)previous=await getTask(existingId);const assignee=data.assigneeId?await get('assignees',data.assigneeId):null;const task={id:existingId||uid(),taskNo:previous?.taskNo||await nextTaskNo(existingId),taskDate:data.taskDate||previous?.taskDate||(previous?.createdAt?previous.createdAt.slice(0,10):timestamp.slice(0,10)),ticketId:(data.externalTicketId??data.ticketId??'').trim(),externalTicketId:(data.externalTicketId??data.ticketId??'').trim(),title:data.title.trim(),description:data.description.trim(),type:data.type,projectId:data.projectId||null,priority:data.priority,assigneeId:assignee?.id||null,assignedBy:assignee?.name||'',status:data.status,codeStatus:data.codeStatus,releaseStage:RELEASE_STAGES.includes(data.releaseStage)?data.releaseStage:releaseStageFor(previous||{instanceStatus:data.instanceStatus}),instanceStatus:data.instanceStatus,workProgress:(data.workProgress||'').trim(),notes:data.notes.trim(),createdAt:previous?.createdAt||timestamp,updatedAt:timestamp,completedAt:previous?.completedAt||null,deletedAt:previous?.deletedAt||null};if(!task.title)throw new Error('Task title is required.');if(!task.taskNo)throw new Error('Internal Task No. could not be generated.');if(previous){const fields=['taskDate','ticketId','externalTicketId','title','description','type','projectId','priority','assigneeId','assignedBy','status','codeStatus','releaseStage','instanceStatus','workProgress','notes'];const changes=[];for(const f of fields)if((previous[f]??'')!==(task[f]??''))changes.push({field:f,from:previous[f]??'',to:task[f]??''});if(previous.status!=='Completed'&&task.status==='Completed'){task.completedAt=timestamp;changes.push({field:'completedAt',from:'',to:timestamp})}if(previous.status==='Completed'&&task.status!=='Completed'){task.completedAt=null;changes.push({field:'completedAt',from:previous.completedAt||'',to:''})}await put('tasks',task);if(changes.length){for(const change of changes){const label=({taskDate:'Task Date',ticketId:'Ticket ID',title:'Title',description:'Description',type:'Task Type',projectId:'Project',priority:'Priority',assignedBy:'Assigned By',status:'Work Status',codeStatus:'Code Status',releaseStage:'Release Stage',instanceStatus:'Instance Status',workProgress:'Work Progress',notes:'Notes',completedAt:'Completion Date'})[change.field]||change.field;let from=change.from,to=change.to;if(change.field==='projectId'){from=(await getProject(from))?.name||'None';to=(await getProject(to))?.name||'None'}await logActivity(task.id,'change',label+' changed',String(from||'—')+' → '+String(to||'—'),{field:change.field,from:change.from,to:change.to})}}}else{await put('tasks',task);await logActivity(task.id,'created','Task created',task.ticketId+' · '+task.title,{taskSnapshot:{ticketId:task.ticketId,title:task.title,status:task.status,priority:task.priority}})}return task}
function statusSelect(name,values,current){return '<select name="'+name+'">'+values.map(v=>'<option '+(v===current?'selected':'')+' value="'+esc(v)+'">'+esc(v)+'</option>').join('')+'</select>'}
function projectSelect(projects,current,includeAll=false){return '<select name="projectId">'+(includeAll?'<option value="">All projects</option>':'<option value="">No project</option>')+projects.filter(p=>!p.archived).sort((a,b)=>a.name.localeCompare(b.name)).map(p=>'<option value="'+p.id+'" '+(p.id===current?'selected':'')+'>'+esc(p.name)+'</option>').join('')+'</select>'}
function field(label,name,value,type='text',extra=''){return '<div class="field"><label for="f-'+name+'">'+label+'</label><input id="f-'+name+'" name="'+name+'" type="'+type+'" value="'+esc(value||'')+'" '+extra+'></div>'}

function releaseStageFor(t){if(RELEASE_STAGES.includes(t?.releaseStage))return t.releaseStage;return ({'TEST':'Testing','UAT':'UAT','Production':'Production Deployed','Not Deployed':'Development'})[t?.instanceStatus]||'Development'}
function taskCard(t,projects,logs=[]){const p=projects.find(x=>x.id===t.projectId);const secs=logs.filter(l=>l.taskId===t.id&&!l.deletedAt).reduce((a,l)=>a+(l.durationSeconds||0),0);const removed=!!t.deletedAt;return '<article class="task-row" data-open-task="'+t.id+'" tabindex="0" role="group" aria-label="Task '+esc(t.ticketId)+'">'+

'<div class="task-meta">'+pill(t.priority,'p-'+norm(t.priority))+' '+pill(t.codeStatus)+' '+pill(releaseStageFor(t))+' '+pill(t.instanceStatus)+'</div>'+
'<div class="row-foot"><span>◷ '+minsLabel(secs)+' logged'+(t.assignedBy?' · Assignee '+esc(t.assignedBy):'')+'</span><span>Open details ↗</span></div>'+

function metric(label,value,icon,sub){return '<div class="metric"><div class="metric-head"><span>'+label+'</span><span class="metric-icon">'+icon+'</span></div><strong>'+value+'</strong><small>'+sub+'</small></div>'}

'<div class="field"><label for="f-taskNo">Internal Task No.</label><input id="f-taskNo" value="'+esc(task.taskNo||'Generated on save')+'" readonly aria-readonly="true"><small class="muted tiny">Assigned automatically from Settings → No. Series.</small></div>'+field('External Ticket ID (optional)','externalTicketId',task.externalTicketId??task.ticketId,'text','maxlength="120" placeholder="Add company ticket ID now or later"')+
selectField('Task Type','type',TYPES,task.type)+
'<div class="field span2"><label for="f-title">Task title *</label><input id="f-title" name="title" required maxlength="180" value="'+esc(task.title)+'" placeholder="Summarize the work clearly"></div>'+

assigneeSelect('Assignee','assigneeId',assignees,selectedAssignee)+
'<div class="field span2 tracking-toggle"><details '+(task.id?'open':'')+'><summary>Tracking details <span>Status, progress and notes</span></summary><div class="form-grid tracking-grid">'+
selectField('Task Status','status',STATUSES,task.status)+

selectField('Instance Status','instanceStatus',INSTANCE_STATUSES,task.instanceStatus)+
'<div class="field span2"><label for="f-workProgress">Work Progress</label><textarea id="f-workProgress" name="workProgress" maxlength="10000" placeholder="What has been completed, what is in progress, and what remains?">'+esc(task.workProgress||'')+'</textarea></div>'+

document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(b){try{const a=b.dataset.action;switch(a){case'open-task':currentTaskId=b.dataset.id;page='detail';await render();break;case'profile-menu-toggle':{const pop=$('#profilePopover');const trigger=$('.profile-trigger');if(pop){pop.classList.toggle('hidden');if(trigger)trigger.setAttribute('aria-expanded',String(!pop.classList.contains('hidden')))}break;}case'edit-profile':{const pop=$('#profilePopover');if(pop)pop.classList.add('hidden');await showProfileForm();break;}case'settings-tab':settingsTab=b.dataset.tab||'profile';await render();break;case'dismiss-profile':{const overlay=$('#enrollOverlay');if(overlay)overlay.remove();await put('settings',{key:'profilePromptDismissed',value:true});break;}case'restore-task':{const t=await getTask(b.dataset.id);if(t&&t.deletedAt){t.deletedAt=null;t.updatedAt=now();await put('tasks',t);await logActivity(t.id,'restored','Task restored','Restored from deleted tasks');await render();showToast('Task restored.')}break}case'new-task':await showTaskForm(false);break;case'edit-task':await showTaskForm(true);break;case'cancel-form':if(page==='assigneeForm')page='assignees';else if(page==='timesheetForm')page='timesheets';else page=currentTaskId?'detail':'dashboard';if(page==='editTask'||page==='newTask')page='dashboard';currentTaskId=null;await render();break;case'complete-task':await markComplete(false);break;case'reopen-task':await markComplete(true);break;case'delete-task':currentTaskId=b.dataset.id||currentTaskId;await softDeleteTask();break;case'log-time':page='tracker';await render();break;case'start-timer':await startTimer($('#timerTask')?.value);break;case'pause-timer':await pauseTimer();break;case'resume-timer':await resumeTimer();break;case'stop-timer':if(confirm('Stop the timer and save the recorded duration?'))await stopTimer();break;case'export':await exportBackup();break;case'export-audit':await exportAuditCsv();break;case'download-report':await downloadTaskReport();break;case'download-report-pdf':await downloadTaskReportPdf();break;case'new-assignee':currentTaskId=null;page='assigneeForm';await render();break;case'edit-assignee':currentTaskId=b.dataset.id;page='assigneeForm';await render();break;case'toggle-assignee':{const a=await get('assignees',b.dataset.id);if(a){a.active=a.active===false?true:false;a.updatedAt=now();await put('assignees',a);await render();showToast(a.active?'Assignee activated.':'Assignee deactivated.')}break}case'new-timesheet':if(timesheetDraftId){showToast('Save or cancel the current draft row first.',true);break}timesheetDraftId='draft-'+uid();page='timesheets';await render();break;case'cancel-timesheet-row':timesheetDraftId=null;await render();break;case'save-timesheet-row':{const ok=await autosaveTimesheetRow(b.dataset.id,true);if(ok)showToast('Timesheet row saved.');break}case'edit-timesheet':currentTaskId=b.dataset.id;page='timesheetForm';await render();break;case'delete-timesheet':{const t=await get('timesheets',b.dataset.id);if(t&&confirm('Delete this timesheet entry?')){t.deletedAt=now();await put('timesheets',t);await render();showToast('Timesheet entry deleted.')}break}case'export-timesheets-csv':await exportTimesheetsCsv();break;case'import':$('#importFile').click();break;case'save-settings':await put('settings',{key:'backupCadence',value:$('#backupCadence').value});await render();showToast('Backup preference saved.');break;case'clear-workspace':await clearWorkspace();break;case'new-project':currentTaskId=null;page='projectForm';await render();break;case'edit-project':currentTaskId=b.dataset.id;page='projectForm';await render();break;case'filter-project':page='history';await render();if($('#projectFilter')){$('#projectFilter').value=b.dataset.id;$('#projectFilter').dispatchEvent(new Event('change'))}break;case'archive-project':{const p=await getProject(b.dataset.id);if(!p)break;p.archived=!p.archived;p.updatedAt=now();await put('projects',p);await logActivityForProject(p.id,p.archived?'Project archived':'Project restored');await render();showToast(p.archived?'Project archived':'Project restored');break}case'delete-time':if(confirm('Delete this time log? The action will remain traceable in the task activity history.')){const l=await get('timeLogs',b.dataset.id);if(l){l.deletedAt=now();await put('timeLogs',l);await logActivity(l.taskId,'time-deleted','Time log deleted',minsLabel(l.durationSeconds));await render();showToast('Time log deleted')}}break;default:break}}catch(err){showToast(err.message||'Action failed.',true)}return;}const pageBtn=e.target.closest('[data-page]');if(pageBtn){page=pageBtn.dataset.page==='tasks'?'newTask':pageBtn.dataset.page;currentTaskId=null;await render();return}const open=e.target.closest('[data-open-task]');if(open){currentTaskId=open.dataset.openTask;page='detail';await render();return}});
async function logActivityForProject(projectId,title){const task=(await all('tasks')).find(t=>t.projectId===projectId);if(task)await logActivity(task.id,'project',title,'Project: '+(await getProject(projectId)).name)}
document.addEventListener('submit',async e=>{e.preventDefault();try{if(e.target.id==='profileForm'){const d=formData(e.target);if(!d.name.trim())throw new Error('Name is required.');const profile={name:d.name.trim(),role:d.role.trim(),team:d.team.trim(),email:d.email.trim(),phone:d.phone.trim(),about:d.about.trim(),updatedAt:now()};await put('settings',{key:'profile',value:profile});await put('settings',{key:'profilePromptDismissed',value:true});$('#enrollOverlay')?.remove();await render();showToast('Profile saved. Welcome to your workspace!')}else if(e.target.id==='numberSeriesForm'){const d=formData(e.target),prefix=d.prefix.trim();if(!prefix)throw new Error('Prefix is required.');if(/[\\r\\n]/.test(prefix))throw new Error('Prefix cannot contain line breaks.');const prior=seriesConfig(await settings());const nextSeries={prefix,padding:prior.padding};await put('settings',{key:'taskNoSeries',value:nextSeries});const tasks=await all('tasks');for(const t of tasks){if(t.taskNo&&String(t.taskNo).startsWith(prior.prefix)){const suffix=String(t.taskNo).slice(prior.prefix.length);if(/^\\d+$/.test(suffix)){t.taskNo=formatTaskNo(Number(suffix),nextSeries);await put('tasks',t)}}}await logActivity(null,'number-series','Task number series changed','Prefix '+prior.prefix+' → '+nextSeries.prefix+'; minimum width '+prior.padding+' → '+nextSeries.padding);await render();showToast('Task No. Series saved. Existing task numbers were updated to the new prefix.')}else if(e.target.id==='taskForm'){const d=formData(e.target);const wasEdit=page==='editTask';const t=await saveTask(d,wasEdit?currentTaskId:null);currentTaskId=t.id;page='detail';await render();showToast(wasEdit?'Task updated.':'Task created.')}else if(e.target.id==='timeForm'){await saveTime(e.target)}else if(e.target.id==='assigneeForm'){const d=formData(e.target);const existing=currentTaskId?await get('assignees',currentTaskId):null;if(!d.employeeId.trim()||!d.name.trim())throw new Error('Assignee ID and name are required.');const duplicate=(await all('assignees')).find(a=>a.id!==existing?.id&&norm(a.employeeId)===norm(d.employeeId));if(duplicate)throw new Error('That assignee ID is already in use.');const a={id:existing?.id||uid(),employeeId:d.employeeId.trim(),name:d.name.trim(),role:d.role.trim(),email:d.email.trim(),team:d.team.trim(),phone:d.phone.trim(),notes:d.notes.trim(),active:existing?.active!==false,createdAt:existing?.createdAt||now(),updatedAt:now()};await put('assignees',a);currentTaskId=null;page='assignees';await render();showToast(existing?'Assignee updated.':'Assignee added.')}else if(e.target.id==='timesheetForm'){const d=formData(e.target);const bill=Number(d.billableHours),non=Number(d.nonBillableHours);if(!d.date||!d.consultantId||!d.projectId||!d.description.trim())throw new Error('Date, consultant, project and description are required.');if(!Number.isFinite(bill)||!Number.isFinite(non)||bill<0||non<0||bill>1000||non>1000||bill+non<=0)throw new Error('Enter valid hours. Total hours must be greater than zero.');const consultant=await get('assignees',d.consultantId),assignee=d.assigneeId?await get('assignees',d.assigneeId):null;if(!consultant||consultant.active===false)throw new Error('Choose an active consultant.');const existing=currentTaskId?await get('timesheets',currentTaskId):null;const t={id:existing?.id||uid(),date:d.date,consultantId:consultant.id,projectId:d.projectId,ticketId:d.ticketId.trim(),description:d.description.trim(),billableHours:bill,nonBillableHours:non,totalHours:Math.round((bill+non)*100)/100,weekOfMonth:'Week '+Math.ceil(Number(d.date.slice(-2))/7),assigneeId:assignee?.id||null,createdAt:existing?.createdAt||now(),updatedAt:now(),deletedAt:null};await put('timesheets',t);currentTaskId=null;page='timesheets';await render();showToast(existing?'Timesheet entry updated.':'Timesheet entry saved.')}else if(e.target.id==='projectForm'){const d=formData(e.target);if(!d.name.trim())throw new Error('Project name is required.');const existing=currentTaskId?await getProject(currentTaskId):null;const p={id:existing?.id||uid(),name:d.name.trim(),description:d.description.trim(),createdAt:existing?.createdAt||now(),updatedAt:now(),archived:existing?.archived||false};await put('projects',p);currentTaskId=null;page='projects';await render();showToast(existing?'Project updated.':'Project created.')}}catch(err){showToast(err.message||'Could not save.',true)}});
document.addEventListener('change',async e=>{if(e.target&&e.target.id==='themePreference'){const theme=e.target.value;applyTheme(theme);await put('settings',{key:'theme',value:theme});showToast('Theme preference saved.')}});
$('#importFile').addEventListener('change',async e=>{try{if(e.target.files?.[0])await importBackupFile(e.target.files[0])}catch(err){showToast('Import failed: '+(err.message||'Invalid backup.'),true)}finally{e.target.value=''}});
window.addEventListener('beforeunload',()=>{if(timerInterval)clearInterval(timerInterval)});
(async()=>{try{db=await openDb();await seed();await ensureTaskNumbers();await readTimer();if(runningTimer&&!runningTimer.pausedAt){const gap=Math.max(0,(Date.now()-new Date(runningTimer.segmentStartedAt).getTime())/1000);if(gap>8*60*60){runningTimer.recoveredGapSeconds=gap;await persistTimer();showToast('Recovered timer gap exceeds 8 hours. Review the duration before saving.');}}await render();await maybeEnrollProfile()}catch(e){$('#appContent').innerHTML='<section class="panel"><h2>Local storage unavailable</h2><p class="muted">'+esc(e.message||'The browser could not open IndexedDB.')+'</p><p class="muted">Try a supported browser or check company browser policies.</p></section>'}})();
})();
</script>
